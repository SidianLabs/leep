# Leep team stack: Postgres metadata + blobs on a volume + leep-server.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# To keep blobs in S3 or any S3-compatible store instead of the volume, set
# LEEP_BLOBS and the AWS_* variables on leep-server (see docs/DEPLOY.md).
#
# WARNING: the database password below is a dev-only placeholder. Change it,
# and keep the published port on localhost or a trusted network, before any
# shared use.
name: leep

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: leep
      POSTGRES_PASSWORD: leep-dev-password # dev-only placeholder
      POSTGRES_DB: leep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leep -d leep"]
      interval: 5s
      timeout: 5s
      retries: 20

  leep-server:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LEEP_LISTEN: 0.0.0.0:7070
      LEEP_META: postgres://leep:leep-dev-password@postgres:5432/leep
      LEEP_BLOBS: file:///var/lib/leep/blobs
    volumes:
      - blobs:/var/lib/leep
    ports:
      - "127.0.0.1:7070:7070"
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
