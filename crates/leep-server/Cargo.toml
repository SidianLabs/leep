[package]
name = "leep-server"
description = "HTTP server for Leep"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "leep-server"
path = "src/main.rs"

[dependencies]
leep-core.workspace = true
leep-derive.workspace = true
leep-meta.workspace = true
leep-store.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
blake3.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
axum = "0.8"
http-body-util = "0.1"
subtle = "2"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
leep-testkit.workspace = true
futures-util.workspace = true
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
bytes.workspace = true
