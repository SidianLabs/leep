[package]
name = "leep-git"
description = "Import, export and live mirroring between git repositories and Leep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "leep-git"
path = "src/main.rs"

[dependencies]
leep-core.workspace = true
leep-derive.workspace = true
leep-store.workspace = true
leep-meta.workspace = true
leep-cli.workspace = true
anyhow.workspace = true
bytes.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive", "env"] }
gix = { version = "0.89", default-features = false, features = ["sha1", "revision", "parallel"] }

[dev-dependencies]
# The review gate (ReviewService, RequireReview) lives in the server; the
# mirror tests need it to show a GitHub approval lets a land through.
leep-server.workspace = true
tempfile = "3"
