[package]
name = "leep-soak"
description = "Soak test: an agent swarm against a real leep-server, with invariants and trend reports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "leep-soak"
path = "src/main.rs"

[[bin]]
name = "leep-land-bench"
path = "src/land_bench.rs"

[dependencies]
leep-core.workspace = true
anyhow.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
