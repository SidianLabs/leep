[package]
name = "leep-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "libFuzzer binaries for Leep; see docs/FUZZING.md"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
leep-fuzz-targets = { path = "../crates/leep-fuzz-targets" }

# Not part of the main workspace: it needs nightly and libFuzzer.
