[workspace]
resolver = "2"
members = ["crates/*"]
# A separate cargo-fuzz crate: it needs nightly and libFuzzer, so the normal
# build never sees it. See docs/FUZZING.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bhaweshbhaskar/leep"

[workspace.dependencies]
leep-core = { path = "crates/leep-core" }
leep-store = { path = "crates/leep-store" }
leep-meta = { path = "crates/leep-meta" }
leep-derive = { path = "crates/leep-derive" }
leep-git = { path = "crates/leep-git" }
leep-server = { path = "crates/leep-server" }
leep-testkit = { path = "crates/leep-testkit" }

anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
blake3 = "1"
criterion = { version = "0.5", features = ["async_tokio"] }
bytes = { version = "1", features = ["serde"] }
ed25519-dalek = "2"
getrandom = "0.3"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
regex = "1"
regex-syntax = "0.8"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zstd = "0.13"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
