[workspace]
resolver = "2"
members = ["crates/*"]
# A separate cargo-fuzz crate: it needs nightly and libFuzzer, so the normal
# build never sees it. See docs/FUZZING.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Matches rust-toolchain.toml; the two move together.
rust-version = "1.97.0"
license = "Apache-2.0"
repository = "https://github.com/bhaweshbhaskar/leep"

[workspace.dependencies]
# Internal crates carry a version as well as a path so no dependency is a
# wildcard (deny.toml, [bans]). Keep it equal to workspace.package.version;
# cargo refuses to resolve if the two drift apart.
leep-core = { path = "crates/leep-core", version = "0.0.1" }
leep-store = { path = "crates/leep-store", version = "0.0.1" }
leep-meta = { path = "crates/leep-meta", version = "0.0.1" }
leep-derive = { path = "crates/leep-derive", version = "0.0.1" }
leep-cli = { path = "crates/leep-cli", version = "0.0.1" }
leep-git = { path = "crates/leep-git", version = "0.0.1" }
leep-server = { path = "crates/leep-server", version = "0.0.1" }
leep-testkit = { path = "crates/leep-testkit", version = "0.0.1" }

anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
base64 = "0.23"
blake3 = "1"
criterion = { version = "0.8", features = ["async_tokio"] }
bytes = { version = "1", features = ["serde"] }
ed25519-dalek = "2"
getrandom = "0.4"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
# RFC 3339 timestamps (token expiry); no time zone database needed.
jiff = { version = "0.2", default-features = false, features = ["std"] }
regex = "1"
regex-syntax = "0.8"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zstd = "0.13"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
