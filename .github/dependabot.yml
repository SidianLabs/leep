# Weekly dependency update PRs. Minor and patch bumps come grouped, one PR per
# ecosystem, so they review as one change; a major bump gets its own PR since
# it can need code changes. Security updates are not limited by these groups
# or the PR limit. cargo-deny (.github/workflows/supply-chain.yml) checks
# every PR against deny.toml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
