name: Fuzz

# Too slow for pull requests. The stable smoke tests in `cargo test` cover
# every target on each PR; this runs the real libFuzzer engine (nightly).
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        default: "60"
      targets:
        description: "Space-separated target names (empty: all)"
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      # The fuzz crate is outside the workspace, so rust-toolchain.toml (the
      # stable pin) does not apply to it; `cargo +nightly` picks nightly.
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # Inputs that found new coverage in earlier runs. The checked-in seeds
      # stay read-only in fuzz/corpus; new inputs land in ci-corpus.
      - uses: actions/cache@v6
        with:
          path: fuzz/ci-corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '60' }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -u
          cd fuzz
          [ -n "$TARGETS" ] || TARGETS="$(cargo +nightly fuzz list)"
          failed=""
          for t in $TARGETS; do
            echo "::group::$t"
            mkdir -p "ci-corpus/$t"
            # -timeout catches hangs; -rss_limit_mb catches memory blowups.
            if ! cargo +nightly fuzz run "$t" "ci-corpus/$t" "corpus/$t" -- \
                -max_total_time="$SECONDS_PER_TARGET" -timeout=30 -rss_limit_mb=4096; then
              echo "::error::fuzz target $t found a crash or timed out"
              failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failing targets:$failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
