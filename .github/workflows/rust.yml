name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

# A newer push to a pull request cancels its older runs. Every push to main
# gets a group of its own (the run id), so those runs are never cancelled or
# replaced while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: the jobs check out, build and test, and write nothing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test fails the job with its log instead of holding a runner for
    # the 6-hour default.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: leep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEEP_TEST_POSTGRES_URL: postgres://postgres:leep@localhost:5432/postgres
      # Line tables keep file:line in backtraces at a fraction of the size of
      # full debug info; the workspace's test binaries with full debug info
      # outgrew the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Versions move only when the maintainer decides; see docs/ROADMAP.md.
      - run: ./scripts/check-version.sh
      # Every alert in docs/OPERATIONS.md has a runbook in docs/RUNBOOKS.md and the other way round.
      - run: ./scripts/check-runbooks.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Disk usage after the tests
        if: always()
        run: df -h . && du -sh target
      # Compile only, so the benches do not rot.
      - run: cargo bench --no-run -p leep-derive

  # The ratio bench (ADR 0081; docs/PERFORMANCE.md, "Ratio bench in CI"):
  # the merge base's server and this change's, built on one runner and run
  # in turn (A B A B) under a short land bench and a 200-agent swarm.
  # Counts gate hard; wall-time ratios only on collapses, and a check whose
  # two A runs disagree is reported inconclusive, not failed. The per-flow
  # operation budgets in `cargo test` are the primary guard; this catches
  # what only a real server and Postgres show. Its own runner, so it adds
  # no time to `test`.
  perf:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: leep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf
      - name: Build this change
        run: |
          cargo build --release -p leep-server -p leep-soak
          mkdir -p "$RUNNER_TEMP/perf/pr"
          cp target/release/leep-{server,land-bench,swarm,perf-compare} "$RUNNER_TEMP/perf/pr/"
      # The same target directory: dependencies build once for both.
      - name: Build the merge base
        run: |
          base=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          git worktree add "$RUNNER_TEMP/perf/base-src" "$base"
          (cd "$RUNNER_TEMP/perf/base-src" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release -p leep-server)
          mkdir -p "$RUNNER_TEMP/perf/base"
          cp target/release/leep-server "$RUNNER_TEMP/perf/base/"
      - name: Ratio bench
        run: >-
          ./scripts/perf-ratio.sh --pg postgres://postgres:leep@localhost:5432/postgres
          --base "$RUNNER_TEMP/perf/base" --pr "$RUNNER_TEMP/perf/pr" --out "$RUNNER_TEMP/perf/runs"
      - name: Server logs
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP"/perf/runs/*/server.log || true

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
