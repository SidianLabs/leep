name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: leep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEEP_TEST_POSTGRES_URL: postgres://postgres:leep@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Versions move only when the maintainer decides; see docs/ROADMAP.md.
      - run: ./scripts/check-version.sh
      # Every alert in docs/OPERATIONS.md has a runbook in docs/RUNBOOKS.md and the other way round.
      - run: ./scripts/check-runbooks.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Compile only, so the benches do not rot.
      - run: cargo bench --no-run -p leep-derive

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
